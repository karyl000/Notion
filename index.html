<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Notion Sans", "Segoe UI", sans-serif;
    }

    #greeting {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.3;
    }

    #date {
      margin-top: 4px;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div id="greeting"></div>
  <div id="date"></div>

  <script>
    function updateWidget() {
      const now = new Date();
      const hour = now.getHours();

      let greeting;

      if (hour < 12) {
        greeting = "☀️ Good morning, Karyl!";
      } else if (hour < 18) {
        greeting = "☀️ Good afternoon, Karyl!";
      } else {
        greeting = "🌙 Good evening, Karyl!";
      }

      const dateOptions = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      };

      document.getElementById("greeting").textContent = greeting;
      document.getElementById("date").textContent =
        now.toLocaleDateString("en-US", dateOptions);
    }

    updateWidget();
  </script>
</body>
</html>
